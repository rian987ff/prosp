<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Músicas de Nossa Senhora — Portal Sagrado</title>
  <meta name="description" content="Ouça os cânticos e louvores dedicados a Nossa Senhora.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/area/area.css">
  <style>
    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 20px;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .back-nav:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(-2px);
    }

    .musicas-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 48px;
    }

    @media (min-width: 640px) {
      .musicas-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .musicas-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .musica-card {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }

    .musica-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-xl);
      transform: translateY(-3px);
    }

    .musica-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #1a120b;
      overflow: hidden;
    }

    .musica-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .musica-card:hover .musica-img {
      transform: scale(1.05);
    }

    .musica-duration-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      backdrop-filter: blur(4px);
    }

    .musica-play-circle {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.25) 50%, transparent 100%);
    }

    .musica-glow {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      background: rgba(201, 139, 44, 0.95);
      color: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 18px rgba(201, 139, 44, 0.5);
      transition: transform 0.2s ease;
    }

    .musica-card:hover .musica-glow {
      transform: scale(1.1);
    }

    .musica-card-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      color: #ffffff;
    }

    .musica-card-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
    }

    .musica-card-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-left">
      <button type="button" class="btn-menu-toggle" onclick="toggleSidebar(true)" aria-label="Abrir Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>
      <a href="/area/" class="brand-logo">
        <img src="/public/area/maria-avatar-BkoYwFrM.jpg" alt="Nossa Senhora Desatadora dos Nós" class="brand-avatar-img">
        <div class="brand-text-wrap">
          <span class="brand-tagline">Portal Sagrado</span>
          <span class="brand-title">Maria Desatadora</span>
        </div>
      </a>
    </div>
  </header>

  <main class="container">
    <a href="/area/novena/" class="back-nav">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Voltar para o Menu da Novena
    </a>

    <div style="margin-bottom: 28px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="section-bar"></span>
        <h1 style="font-family:var(--font-serif); font-size:30px; font-weight:700; color:var(--text-main);">Músicas de Nossa Senhora</h1>
      </div>
      <p style="font-size:16px; color:var(--text-muted); margin-top:6px; margin-left:18px;">Toque para ouvir e orar ao som dos cânticos marianos.</p>
    </div>

    <div class="musicas-grid" id="musicas-grid">
      <!-- Renderizado via data.js -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-cross">✦</div>
      <p class="footer-prayer">“Maria, Desatadora dos Nós, rogai por nós que recorremos a Vós.”</p>
      <div class="footer-brand">
        <span class="footer-title">Portal Sagrado</span>
        <span class="footer-copy">Novena de Nossa Senhora Desatadora dos Nós</span>
      </div>
    </div>
  </footer>

  <script src="/area/data.js"></script>
  <script src="/area/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      NovenaAuth.requireAuth();
      renderMusicas();
    });

    function renderMusicas() {
      const grid = document.getElementById('musicas-grid');
      if (!grid || !window.NOVENA_DATA) return;

      grid.innerHTML = window.NOVENA_DATA.musicas.map(m => `
        <button type="button" class="musica-card" onclick='openPlayer(${JSON.stringify(m)})'>
          <div class="musica-img-wrap">
            <img src="/public/area/musicas-Dd5tyfWp.jpg" alt="${m.title}" loading="lazy" class="musica-img">
            <span class="musica-duration-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              ${m.duration}
            </span>
            <div class="musica-play-circle">
              <div class="musica-glow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              </div>
            </div>
            <div class="musica-card-bottom">
              <h3 class="musica-card-title">${m.title}</h3>
              <p class="musica-card-sub">${m.subtitle}</p>
            </div>
          </div>
        </button>
      `).join('');
    }
  </script>
</body>
</html>
